  /v1/local/plugs/{plug}/wait:
    get:
      tags:
      - local
      summary: Wait until the plug is on, off, online or offline
      operationId: waitLocalPlug
      parameters:
      - name: plug
        in: path
        required: true
        schema:
          type: string
          description: MAC (any separator), IPv4 address or hostname (local), or MAC or 40-hex TP-Link
            deviceId (cloud). See SPEC §5.
          examples:
          - 00:00:5E:00:53:01
          title: Plug
        description: MAC (any separator), IPv4 address or hostname (local), or MAC or 40-hex TP-Link deviceId
          (cloud). See SPEC §5.
      - name: until
        in: query
        required: true
        schema:
          enum:
          - 'on'
          - 'off'
          - online
          - offline
          type: string
          description: Condition to wait for.
          title: Until
        description: Condition to wait for.
      - name: timeout_s
        in: query
        required: false
        schema:
          type: number
          maximum: 300
          minimum: 1
          description: Wait window in seconds.
          default: 30
          title: Timeout S
        description: Wait window in seconds.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitResult'
              example:
                driver: local
                plug:
