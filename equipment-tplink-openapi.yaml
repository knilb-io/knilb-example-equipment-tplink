openapi: 3.1.0
info:
  title: equipment-tplink
  description: 'TP-Link Kasa energy plugs as Knilb test equipment and as a device under test.


    Two drivers sit behind one contract: `local` (python-kasa over the LAN) and `cloud`

    (tplink-cloud-api over the TP-Link account API). Both libraries are used through

    their public APIs only; their limitations are surfaced, not worked around (see the

    README''s "Known library limitations" and FINDINGS.md). Every plug response carries an

    `upstream` block with the library calls behind it.


    **No authentication.** Run only on a trusted LAN behind Knilb''s reachability layer.

    '
  version: 0.0.0
servers:
- url: http://{host}:{port}
  variables:
    host:
      default: localhost
    port:
      default: '8080'
paths:
  /v1/health:
    get:
      tags:
      - system
      summary: Service and driver health
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                local:
                  status: ready
                  discovery_target: 255.255.255.255
                  plugs_known: 1
                cloud:
                  status: authenticated
                  last_error: null
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal_error
                  value:
                    code: internal_error
                    message: internal error
                    driver: none
                    plug: null
                    upstream: null
                    detail:
                      type: RuntimeError
  /v1/version:
    get:
      tags:
      - system
      summary: Service and library versions
      operationId: getVersion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              example:
                version: 0.1.0
                python: 3.12.14
                python_kasa: 0.12.0
                tplink_cloud_api: 5.2.1
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal_error
                  value:
                    code: internal_error
                    message: internal error
                    driver: none
                    plug: null
                    upstream: null
                    detail:
                      type: RuntimeError
  /v1/plugs:
    get:
      tags:
      - directory
      summary: All known plugs, merged by MAC
      operationId: listPlugs
      parameters:
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Run LAN discovery and a cloud list first.
          default: false
          title: Refresh
        description: Run LAN discovery and a cloud list first.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlugDirectory'
              example:
                plugs:
                - mac: 00:00:5E:00:53:01
                  alias: Bench lamp
                  model: KP115(US)
                  local:
                    host: 192.0.2.10
                    auth: failed
                    seen_at: '2026-09-22T12:00:00.000Z'
                  cloud:
                    device_id: 8006F1A2B3C4D5E6F708192A3B4C5D6E7F801234
                    online: true
                    seen_at: '2026-09-22T12:00:00.000Z'
                local_error: null
                cloud_error: null
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  summary: validation_error
                  value:
                    code: validation_error
                    message: request validation failed
                    driver: none
                    plug: null
                    upstream: null
                    detail:
                      errors:
                      - loc:
                        - body
                        - state
                        msg: Input should be 'on', 'off' or 'toggle'
                        type: literal_error
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal_error
                  value:
