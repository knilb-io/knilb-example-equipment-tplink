components:
  schemas:
    AccountEntry:
      properties:
        online:
          type: boolean
          title: Online
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
        app_server_url:
          anyOf:
          - type: string
          - type: 'null'
          title: App Server Url
      type: object
      required:
      - online
      - region
      - app_server_url
      title: AccountEntry
      description: The account device list's view of the plug (cloud only).
    ActionAccepted:
      properties:
        driver:
          type: string
          enum:
          - local
          - cloud
          title: Driver
        plug:
          $ref: '#/components/schemas/PlugIdentity'
        action:
          type: string
          enum:
          - reboot
          - factory_reset
          title: Action
        accepted_at:
          type: string
          format: date-time
          title: Accepted At
        upstream:
          $ref: '#/components/schemas/Upstream'
      type: object
      required:
      - driver
      - plug
      - action
      - accepted_at
      - upstream
      title: ActionAccepted
      description: A reboot or factory reset was accepted by the plug.
    CloudHealth:
      properties:
        status:
          $ref: '#/components/schemas/CloudState'
        last_error:
          anyOf:
          - $ref: '#/components/schemas/ErrorSummary'
          - type: 'null'
      type: object
      required:
      - status
      - last_error
      title: CloudHealth
      description: Cloud driver health.
    CloudLink:
      properties:
        bound:
          type: boolean
          title: Bound
        connected:
          type: boolean
          title: Connected
        server:
          anyOf:
          - type: string
          - type: 'null'
          title: Server
        username_masked:
          anyOf:
          - type: string
          - type: 'null'
          title: Username Masked
      type: object
      required:
      - bound
      - connected
      - server
      - username_masked
      title: CloudLink
      description: The plug's own view of its cloud connection (local only).
    CloudLoginRequest:
      properties:
        mfa_code:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 1
          - type: 'null'
          title: Mfa Code
      additionalProperties: false
      type: object
      title: CloudLoginRequest
      description: Start a cloud login, or supply the MFA code a pending login waits for.
    CloudPlug:
      properties:
        plug:
          $ref: '#/components/schemas/PlugIdentity'
        supported:
          type: boolean
          title: Supported
        online:
          type: boolean
          title: Online
        sw_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Sw Version
        hw_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Hw Version
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
      type: object
      required:
      - plug
      - supported
      - online
      - sw_version
      - hw_version
      - region
      title: CloudPlug
      description: A device in the TP-Link account.
    CloudPlugList:
      properties:
        cached:
          type: boolean
          title: Cached
        fetched_at:
          type: string
          format: date-time
          title: Fetched At
        plugs:
          items:
            $ref: '#/components/schemas/CloudPlug'
          type: array
          title: Plugs
        upstream:
          $ref: '#/components/schemas/Upstream'
      type: object
      required:
      - cached
      - fetched_at
      - plugs
      - upstream
      title: CloudPlugList
      description: The account device list.
    CloudSession:
      properties:
        state:
          $ref: '#/components/schemas/CloudState'
        username_masked:
          anyOf:
          - type: string
          - type: 'null'
          title: Username Masked
        logged_in_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Logged In At
        last_error:
          anyOf:
          - $ref: '#/components/schemas/ErrorSummary'
          - type: 'null'
      type: object
      required:
      - state
      - username_masked
      - logged_in_at
      - last_error
      title: CloudSession
      description: Cloud login state.
    CloudState:
      type: string
      enum:
      - not_configured
      - authenticated
      - mfa_required
      - login_required
      - error
      title: CloudState
      description: Cloud session state.
    DeviceInfo:
      properties:
        driver:
          type: string
          enum:
          - local
          - cloud
          title: Driver
        plug:
          $ref: '#/components/schemas/PlugIdentity'
        hw_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Hw Version
        sw_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Sw Version
        has_energy_monitoring:
          type: boolean
          title: Has Energy Monitoring
        cloud_link:
          anyOf:
          - $ref: '#/components/schemas/CloudLink'
          - type: 'null'
        account_entry:
          anyOf:
          - $ref: '#/components/schemas/AccountEntry'
          - type: 'null'
        upstream:
          $ref: '#/components/schemas/Upstream'
      type: object
      required:
      - driver
      - plug
      - hw_version
      - sw_version
      - has_energy_monitoring
      - cloud_link
      - account_entry
      - upstream
      title: DeviceInfo
      description: Hardware, firmware and cloud-link details.
    DirectoryCloud:
      properties:
        device_id:
          type: string
          title: Device Id
        online:
          type: boolean
          title: Online
        seen_at:
          type: string
          format: date-time
          title: Seen At
      type: object
      required:
      - device_id
      - online
      - seen_at
      title: DirectoryCloud
      description: Where the plug was last seen in the account.
    DirectoryEntry:
      properties:
        mac:
          type: string
          title: Mac
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        local:
          anyOf:
          - $ref: '#/components/schemas/DirectoryLocal'
          - type: 'null'
        cloud:
          anyOf:
          - $ref: '#/components/schemas/DirectoryCloud'
          - type: 'null'
      type: object
      required:
      - mac
      - alias
      - model
      - local
      - cloud
      title: DirectoryEntry
      description: One physical plug, merged across drivers by MAC.
    DirectoryLocal:
      properties:
        host:
          type: string
          title: Host
        auth:
          type: string
          enum:
          - ok
          - failed
          - not_attempted
          title: Auth
        seen_at:
          type: string
          format: date-time
          title: Seen At
      type: object
      required:
      - host
      - auth
      - seen_at
      title: DirectoryLocal
      description: Where the plug was last seen on the LAN.
    DiscoveredPlug:
      properties:
        plug:
          $ref: '#/components/schemas/PlugIdentity'
        supported:
          type: boolean
          title: Supported
        connection:
          $ref: '#/components/schemas/LocalConnection'
        auth:
          type: string
          enum:
          - ok
          - failed
          - not_attempted
          title: Auth
        auth_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Auth Error
        discovered_at:
          type: string
          format: date-time
          title: Discovered At
      type: object
      required:
      - plug
      - supported
      - connection
      - auth
      - auth_error
      - discovered_at
      title: DiscoveredPlug
      description: A Kasa device that answered LAN discovery.
    EnergyReading:
      properties:
        driver:
          type: string
          enum:
          - local
          - cloud
          title: Driver
        plug:
          $ref: '#/components/schemas/PlugIdentity'
        power_w:
          type: number
          title: Power W
        voltage_v:
          anyOf:
          - type: number
          - type: 'null'
          title: Voltage V
        current_a:
          anyOf:
          - type: number
          - type: 'null'
          title: Current A
        energy_total_kwh:
          anyOf:
          - type: number
          - type: 'null'
          title: Energy Total Kwh
        observed_at:
          type: string
          format: date-time
          title: Observed At
        upstream:
          $ref: '#/components/schemas/Upstream'
      type: object
      required:
      - driver
      - plug
      - power_w
      - voltage_v
      - current_a
      - energy_total_kwh
      - observed_at
      - upstream
      title: EnergyReading
      description: One instantaneous energy reading.
    Error:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        driver:
          type: string
          enum:
          - local
          - cloud
          - none
          title: Driver
          default: none
        plug:
          anyOf:
          - $ref: '#/components/schemas/PlugIdentity'
          - type: 'null'
        upstream:
          anyOf:
          - $ref: '#/components/schemas/Upstream'
          - type: 'null'
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Detail
      type: object
      required:
      - code
      - message
      - driver
      - plug
      - upstream
      - detail
      title: Error
      description: Every error response.
    ErrorSummary:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorSummary
      description: A short error description.
    FactoryResetRequest:
      properties:
        confirm_mac:
          type: string
          title: Confirm Mac
          description: Must equal the resolved plug's MAC (any accepted format).
      additionalProperties: false
      type: object
      required:
      - confirm_mac
      title: FactoryResetRequest
      description: Factory reset confirmation.
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        version:
          type: string
          title: Version
        local:
          $ref: '#/components/schemas/LocalHealth'
        cloud:
          $ref: '#/components/schemas/CloudHealth'
      type: object
      required:
      - status
      - version
      - local
      - cloud
      title: Health
      description: Service health.
    LocalConnection:
      properties:
        host:
          type: string
          title: Host
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
        encrypt_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Encrypt Type
        login_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Login Version
      type: object
      required:
      - host
      - port
      - encrypt_type
      - login_version
      title: LocalConnection
